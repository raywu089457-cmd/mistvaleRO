<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script>
/* v1.5.5：遊戲網址改為 xianjingro.fun（Cloudflare）；雲端存檔、排行、組隊、聊天照舊在 Netlify（經 Cloudflare 轉接 /api/…）
   RO_HOME（新網址）、RO_OLD（舊網址）由部署程式（netlify/stamp.mjs）填入；空字串＝都不作用（直接開啟本機檔案、測試）
   ・舊網址 xianjingro.netlify.app：交給搬家頁 move.html，把這台裝置的本機存檔搬到新網址（這次瀏覽期間選擇留在舊網址的除外）
   ・cdn.xianjingro.fun、xianjingro.pages.dev：轉到 xianjingro.fun（同一個遊戲只用一個網址，存檔才不會分散）
   ・xianjingro.fun：#move=搬家碼 → 取回舊網址的存檔並寫入；這台裝置在新網址還沒有存檔 → 先到舊網址看看有沒有要搬的 */
window.RO_HOME = "https://xianjingro.fun/"; window.RO_OLD = "https://xianjingro.netlify.app/";
(function () {
  var HOME = window.RO_HOME, OLD = window.RO_OLD;
  if (!HOME || !OLD) return;
  var here = location.origin + "/";
  var ss = function (k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } };
  var halt = function () { try { window.stop(); } catch (e) {} };
  // 1. 舊網址
  if (here === OLD) {
    if (/index-local\.html$/.test(location.pathname) || /[?&]stay=1/.test(location.search) || ss("roStay") === "1") return;
    halt();
    location.replace("/move.html" + location.search + location.hash);
    return;
  }
  // 2. 其他入口轉到正式網址
  if (here !== HOME) {
    if (/(^|\.)xianjingro\.fun$|(^|\.)xianjingro\.pages\.dev$/.test(location.hostname)) {
      halt();
      location.replace(HOME.replace(/\/$/, "") + location.pathname + location.search + location.hash);
    }
    return;
  }
  // 3. 正式網址
  var SAVE = /^ro-wanderer\.v3\.(v1$|c\.|@[0-9a-f]+\.(v1$|c\.))/; // 角色存檔（含雲端角色）
  var GAME = /^ro-wanderer\.v3\.(v1$|c\.|stash$|roster$|@)/; // 角色、共用倉庫、角色清單
  var all = function () { var o = {}; try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k) o[k] = localStorage.getItem(k); } } catch (e) {} return o; };
  var has = function (o) { for (var k in o) if (GAME.test(k)) return true; return false; };
  var mark = function () { try { localStorage.setItem("roMoveChecked", "1"); } catch (e) {} };
  var m = /[#&]move=([0-9a-z]+\.[0-9a-f]+)/.exec(location.hash);
  if (m) {
    halt();
    var code = m[1];
    var page = function (msg, btns) {
      document.documentElement.innerHTML =
        '<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>流浪仙境</title><style>' +
        'html,body{margin:0;height:100%;background:#0e0b16;color:#e9e3f5;font:16px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}' +
        '.b{max-width:420px;margin:0 auto;padding:18vh 22px;text-align:center}h1{font-size:26px;margin:0 0 14px;color:#ffd98a}' +
        'button{display:block;width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1px solid #5b4a7a;background:#2a1f3d;color:#fff;font:inherit;cursor:pointer}' +
        'button.p{background:#ffd98a;color:#2a1a00;border-color:#ffd98a;font-weight:700}</style></head><body><div class="b"><h1>流浪仙境</h1><p id="m"></p><div id="x"></div></div></body>';
      document.getElementById("m").textContent = msg;
      var x = document.getElementById("x");
      (btns || []).forEach(function (b) {
        var e = document.createElement("button");
        e.textContent = b[0];
        if (b[2]) e.className = "p";
        e.onclick = b[1];
        x.appendChild(e);
      });
    };
    // 存檔裡最新的存檔時間（角色存檔的 t；壓縮過的存檔先解壓）
    var latest = function (o) {
      var ks = Object.keys(o).filter(function (k) { return SAVE.test(k); });
      return Promise.all(
        ks.map(function (k) {
          var v = String(o[k] || "");
          if (v.indexOf("Z1:") !== 0) return Promise.resolve(v).then(JSON.parse).then(function (x) { return x && +x.t; }, function () { return 0; });
          if (typeof DecompressionStream === "undefined") return Promise.reject(new Error("unzip"));
          var b = atob(v.slice(v.indexOf(":", 3) + 1)), u = new Uint8Array(b.length);
          for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
          return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text().then(JSON.parse).then(function (x) { return x && +x.t; });
        }),
      ).then(function (ts) { return ts.reduce(function (a, b) { return Math.max(a, b || 0); }, 0); });
    };
    var put = function (d) {
      var cur = all();
      for (var k in cur) if (!/^roMove/.test(k)) localStorage.removeItem(k);
      for (var k2 in d) localStorage.setItem(k2, d[k2]);
    };
    var done = function (msg) {
      mark();
      fetch("/api/move", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ack: code }) })
        .catch(function () {})
        .then(function () {
          if (!msg) return location.replace("/");
          page(msg);
          setTimeout(function () { location.replace("/"); }, 2500);
        });
    };
    var oldGo = function () { location.replace(OLD + "move.html?stay=1"); };
    var bad = function (e) {
      page("匯入舊網址的存檔失敗（" + (e && e.message ? e.message : "網路問題") + "）。舊網址的存檔都還在，不會遺失。", [
        ["重試", function () { location.reload(); }, 1],
        ["回舊網址繼續玩", oldGo],
      ]);
    };
    page("正在匯入舊網址的存檔…");
    fetch("/api/move?code=" + encodeURIComponent(code), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.d) throw new Error(j && j.err === "expired" ? "搬家碼已過期" : "找不到這份存檔");
        var cur = all();
        if (!has(cur)) return put(j.d), done();
        // 這台裝置在新網址已經有存檔：保留較新的那份
        return Promise.all([latest(j.d), latest(cur)]).then(
          function (t) {
            if (t[0] > t[1]) return put(j.d), done("已換成舊網址搬來的存檔（比這裡的存檔新）。");
            done("這台裝置在新網址的存檔比較新，已保留新網址的存檔。");
          },
          function () {
            page("這台裝置在新網址已經有存檔，要用哪一份？", [
              ["使用舊網址搬來的存檔", function () { try { put(j.d); done(); } catch (e) { bad(e); } }, 1],
              ["保留這裡目前的存檔", function () { done(); }],
            ]);
          },
        );
      })
      .catch(bad);
    return;
  }
  if (/[#&]moved=/.test(location.hash)) {
    mark();
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    return;
  }
  // 這台裝置在新網址還沒有存檔：先到舊網址看看有沒有要搬的（每台裝置只看一次；舊網址的搬家頁還沒上線就下次再看）
  var cur = all();
  var checked = "";
  try { checked = localStorage.getItem("roMoveChecked") || ""; } catch (e) { checked = "1"; }
  if (!has(cur) && checked !== "1" && ss("roMoveTried") !== "1") {
    ss("roMoveTried", "1");
    fetch(OLD + "move.html", { method: "HEAD", mode: "cors", cache: "no-store" })
      .then(function (r) {
        if (!r.ok) return;
        halt();
        location.replace(OLD + "move.html?check=1");
      })
      .catch(function () {});
  }
})();
</script>
<script>
/* v1.5.4：圖片、地圖、音樂與程式改由 Cloudflare（cdn.xianjingro.fun）送出，載不到時改從本站下載
   RO_CDN 由部署程式（netlify/stamp.mjs）填入；空字串＝全部從本站載入，以下都不作用 */
window.RO_CDN = "https://cdn.xianjingro.fun/";
(function () {
  var CDN = window.RO_CDN, LOCAL = /index-local\.html$/.test(location.pathname);
  // 程式全部從本站載入的版本：這次瀏覽期間 Cloudflare 載不到才會用；其他時候回到一般版本
  if (LOCAL && !/[?&]nocdn=/.test(location.search)) {
    var off = "1";
    try { off = sessionStorage.getItem("roCdnOff"); } catch (e) {}
    if (off !== "1") return location.replace("/" + location.search + location.hash);
  }
  if (!CDN) return;
  var isCdn = function (u) { return typeof u === "string" && u.indexOf(CDN) === 0; };
  // 累計 10 個檔案載不到：當成 Cloudflare 暫時連不上，這一頁之後的圖片直接從本站下載
  var fails = 0, down = function () { return fails >= 10; };
  // 圖片、音樂載不到：改從本站下載同一個檔案（只換一次）
  function fb(e) {
    var t = e.target, s = t && (t.src || t.href);
    if (!isCdn(s) || t.roCdnFb) return false;
    t.roCdnFb = 1;
    fails++;
    e.stopImmediatePropagation();
    var play = t.tagName === "AUDIO" && !t.paused;
    t.src = s.slice(CDN.length);
    if (play) try { t.play().catch(function () {}); } catch (x) {}
    return true;
  }
  // new Image()：Cloudflare 的圖片要帶跨網域標記，畫面才能讀取圖片內容（頭像、圖示）
  var I = window.Image, D = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
  if (I && D && D.set) {
    var W = function (w, h) {
      var im = arguments.length > 1 ? new I(w, h) : arguments.length ? new I(w) : new I();
      Object.defineProperty(im, "src", {
        configurable: true,
        get: function () { return D.get.call(this); },
        set: function (v) {
          v = String(v);
          if (isCdn(v)) {
            if (down()) v = v.slice(CDN.length);
            else if (!this.crossOrigin) this.crossOrigin = "anonymous";
          }
          D.set.call(this, v);
        },
      });
      im.addEventListener("error", fb);
      return im;
    };
    W.prototype = I.prototype;
    window.Image = W;
  }
  var A = window.Audio;
  if (A) {
    var WA = function (src) {
      var a = arguments.length ? new A(src) : new A();
      a.addEventListener("error", fb);
      return a;
    };
    WA.prototype = A.prototype;
    window.Audio = WA;
  }
  // 頁面裡的 <img>、<audio>；程式（<script>、樣式表）載不到 → 改用全部從本站載入的版本
  document.addEventListener("error", function (e) {
    var t = e.target, tag = t && t.tagName;
    if (tag === "IMG" || tag === "AUDIO" || tag === "SOURCE") return void fb(e);
    if ((tag === "SCRIPT" || tag === "LINK") && isCdn(t.src || t.href) && !LOCAL && !window.roCdnOff) {
      window.roCdnOff = 1;
      try { sessionStorage.setItem("roCdnOff", "1"); } catch (x) {}
      location.replace("/index-local.html" + (location.search ? location.search + "&" : "?") + "nocdn=1" + location.hash);
    }
  }, true);
})();
</script>
